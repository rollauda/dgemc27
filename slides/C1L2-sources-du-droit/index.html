<h1 id="c1l2---les-sources-du-droit">C1L2 - Les sources du droit</h1>
<h2 id="si-une-r%C3%A8gle-en-viole-une-autre-qui-peut-lannuler">Si une règle en viole une autre, qui peut l'annuler ?</h2>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="2" data-paginate="true" data-theme="dgemc" lang="fr-FR" data-marpit-pagination="2" style="--paginate:true;--theme:dgemc;" data-marpit-pagination-total="46" data-size="16:9">
<h3 id="%C3%A0-retenir--les-sources-du-droit">À retenir — Les sources du droit</h3>
<p>Les <strong>sources du droit</strong> sont les endroits d'où viennent les règles : qui les écrit, et avec quelle autorité ? En France, ce sont <strong>la Constitution, le droit international, les lois, les règlements, la coutume et la jurisprudence</strong>.</p>
<p>Ces règles ne se valent pas : elles sont <strong>classées</strong>. On parle de <strong>hiérarchie des normes</strong> : quand deux règles se contredisent, la règle inférieure doit céder devant la règle supérieure. C'est ce qui rend le droit <strong>cohérent</strong>.</p>
<p>C'est aussi ce qui fait un <strong>État de droit</strong> : un État qui n'est pas au-dessus des lois, qui n'utilise pas son pouvoir de manière arbitraire, et qui obéit lui-même à des règles — y compris quand il écrit les règles.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="3" data-paginate="true" data-class="lead transition" data-theme="dgemc" lang="fr-FR" class="lead transition" data-marpit-pagination="3" style="--paginate:true;--class:lead transition;--theme:dgemc;" data-marpit-pagination-total="46" data-size="16:9">
<h2 id="1-quest-ce-quune-loi">1. Qu'est-ce qu'une loi ?</h2>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="4" data-paginate="true" data-theme="dgemc" lang="fr-FR" data-marpit-pagination="4" style="--paginate:true;--theme:dgemc;" data-marpit-pagination-total="46" data-size="16:9">
<h3 id="%C3%A0-retenir--ce-quest-une-r%C3%A8gle-de-droit">À retenir — Ce qu'est une règle de droit</h3>
<p>Une loi est une <strong>règle de droit</strong>. Elle est en général écrite dans un <strong>code</strong>, un livre qui rassemble les lois d'un même domaine : code pénal (infractions et peines), code civil (relations entre particuliers), code de la santé publique, etc.</p>
<p>Une règle de droit a <strong>six caractéristiques principales</strong>. Elle est :</p>
<ul>
<li><strong>Générale</strong> : elle vaut sur tout le territoire.</li>
<li><strong>Abstraite et impersonnelle</strong> : elle ne vise pas une personne. <em>Rappel : le Conseil d'État n'a pas jugé M. Wackenheim, il a jugé le spectacle.</em></li>
<li><strong>À finalité sociale</strong> : elle organise la vie commune, non la morale individuelle de chacun.</li>
<li><strong>Permanente</strong> : elle s'applique tant qu'elle n'a pas été abrogée (= supprimée).</li>
<li><strong>Obligatoire</strong> : elle s'impose à tous, qu'on l'approuve ou non.</li>
<li><strong>Coercitive</strong> : l'État la fait appliquer par des <strong>sanctions</strong>.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="5" data-paginate="true" data-theme="dgemc" lang="fr-FR" data-marpit-pagination="5" style="--paginate:true;--theme:dgemc;" data-marpit-pagination-total="46" data-size="16:9">
<h3 id="%C3%A0-retenir--la-sanction-et-%C3%A0-quoi-sert-une-loi">À retenir — La sanction, et à quoi sert une loi</h3>
<p>La sanction prend plusieurs formes : la <strong>contrainte directe</strong> (<em>manu militari</em>), la <strong>nullité</strong> de l'acte, la <strong>responsabilité civile</strong> (des dommages-intérêts, versés à la victime) et la <strong>responsabilité pénale</strong> (une amende, versée au Trésor public, ou la prison).</p>
<p>Une loi peut faire trois choses :</p>
<ul>
<li><strong>Interdire</strong> un comportement, en prévoyant une punition : le vol est puni de trois ans d'emprisonnement (art. 311-3 du code pénal).</li>
<li><strong>Obliger</strong> à un comportement : celui qui cause un dommage à autrui par sa faute doit le réparer (art. 1240 du code civil).</li>
<li><strong>Autoriser</strong> explicitement un comportement : une femme peut demander l'interruption de sa grossesse (art. L2212-1 du code de la santé publique).</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="6" data-paginate="true" data-class="text" data-theme="dgemc" lang="fr-FR" class="text" data-marpit-pagination="6" style="--paginate:true;--class:text;--theme:dgemc;" data-marpit-pagination-total="46" data-size="16:9">
<h3 id="l%C3%A9laboration-de-la-loi">L'élaboration de la loi</h3>
<blockquote>
<p><strong>Art. 24.</strong> Le Parlement vote la loi. Il contrôle l'action du Gouvernement. Il évalue les politiques publiques.</p>
<p><strong>Art. 34.</strong> La loi fixe les règles concernant : […] la détermination des crimes et délits ainsi que les peines qui leur sont applicables ; […]</p>
<p><strong>Art. 37.</strong> Les matières autres que celles qui sont du domaine de la loi ont un caractère réglementaire.</p>
<p><strong>Art. 39.</strong> L'initiative des lois appartient concurremment au Premier ministre et aux membres du Parlement.</p>
<p><strong>Art. 45.</strong> Tout projet ou proposition de loi est examiné successivement dans les deux assemblées du Parlement en vue de l'adoption d'un texte identique. […]</p>
<p><strong>Art. 10.</strong> Le Président de la République promulgue les lois dans les quinze jours qui suivent la transmission au Gouvernement de la loi définitivement adoptée. […]</p>
</blockquote>
<p><small>— Constitution française du 4 octobre 1958, art. 24, 34, 37, 39, 45 et 10</small></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="7" data-paginate="true" data-theme="dgemc" lang="fr-FR" data-marpit-pagination="7" style="--paginate:true;--theme:dgemc;" data-marpit-pagination-total="46" data-size="16:9">
<h3 id="vocabulaire">Vocabulaire</h3>
<ul>
<li><strong>Loi</strong> : règle générale votée par le Parlement (Assemblée nationale + Sénat).</li>
<li><strong>Règlement</strong> : règle prise par le Gouvernement (= un <strong>décret</strong>) ou par une autorité administrative (= un <strong>arrêté</strong> d'un ministre, d'un préfet, d'un maire).</li>
<li><strong>Projet de loi</strong> : texte proposé par le Gouvernement.</li>
<li><strong>Proposition de loi</strong> : texte proposé par un député ou un sénateur.</li>
<li><strong>Promulguer</strong> : pour le Président, signer la loi et ordonner qu'elle soit appliquée.</li>
<li><strong>Journal officiel</strong> : publication où paraissent les lois ; une loi non publiée n'oblige personne.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="8" data-paginate="true" data-theme="dgemc" lang="fr-FR" data-marpit-pagination="8" style="--paginate:true;--theme:dgemc;" data-marpit-pagination-total="46" data-size="16:9">
<h2 id="questions">Questions</h2>
<ol>
<li>Qui vote la loi ? Qui prend les règlements ?</li>
<li>Qui a le droit de décider qu'un comportement est un délit puni de prison : le Parlement ou le Gouvernement ? Quel article le dit ?</li>
<li>Remettez dans l'ordre : <em>publication · vote par les deux assemblées · dépôt du texte · promulgation</em>.</li>
</ol>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="9" data-paginate="true" data-theme="dgemc" lang="fr-FR" data-marpit-pagination="9" style="--paginate:true;--theme:dgemc;" data-marpit-pagination-total="46" data-size="16:9">
<h3 id="%C3%A0-retenir-%E2%80%93-loi-ordonnance-d%C3%A9cret-arr%C3%AAt%C3%A9">À retenir – Loi, ordonnance, décret, arrêté</h3>
<ul>
<li><strong>Loi</strong> : règle générale votée par le <strong>Parlement</strong>, qui comprend deux chambres : l'<strong>Assemblée nationale</strong>, élue directement par les citoyens, et le <strong>Sénat</strong>, élu au suffrage indirect, surtout par des élus locaux (art. 24). La loi est réservée aux sujets les plus importants : les libertés, les crimes et les délits, les impôts… (art. 34).</li>
<li><strong>Ordonnance</strong> : le Gouvernement demande au Parlement l'autorisation de prendre lui-même, pendant un temps limité, des mesures qui relèvent normalement de la loi (art. 38). Tant que le Parlement ne l'a pas <strong>ratifiée</strong> par un vote exprès, l'ordonnance reste un acte du Gouvernement ; une fois ratifiée, elle a <strong>valeur de loi</strong>.</li>
<li><strong>Décret</strong> : règle prise par le <strong>Premier ministre</strong> (art. 21) ou par le <strong>Président de la République</strong> en conseil des ministres (art. 13). Il vaut pour tout le territoire.</li>
<li><strong>Arrêté</strong> : règle prise par un <strong>ministre</strong>, un <strong>préfet</strong> ou un <strong>maire</strong>, pour un domaine ou un territoire particulier.</li>
</ul>
<p>Décrets et arrêtés forment les <strong>règlements</strong> : ils ne sont pas votés, ils sont plus précis que la loi, et ils règlent tout ce que la Constitution ne réserve pas à la loi (art. 37). Ils évitent que la loi se perde dans les détails.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="10" data-paginate="true" data-theme="dgemc" lang="fr-FR" data-marpit-pagination="10" style="--paginate:true;--theme:dgemc;" data-marpit-pagination-total="46" data-size="16:9">

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="11" data-paginate="true" data-class="text" data-theme="dgemc" lang="fr-FR" class="text" data-marpit-pagination="11" style="--paginate:true;--class:text;--theme:dgemc;" data-marpit-pagination-total="46" data-size="16:9">
<h3 id="le-parcours-dune-loi-en-%C3%A9quateur-small12small">Le parcours d'une loi en Équateur <small>(1/2)</small></h3>
<blockquote>
<p><strong>Art. 134.</strong> La iniciativa para presentar proyectos de ley corresponde :</p>
<ol>
<li>A las asambleístas y los asambleístas, con el apoyo de una bancada legislativa o de al menos el cinco por ciento de los miembros de la Asamblea Nacional.</li>
<li>A la Presidenta o Presidente de la República. […]</li>
<li>A las ciudadanas y los ciudadanos que estén en goce de los derechos políticos y a las organizaciones sociales que cuenten con el respaldo de por lo menos el cero punto veinticinco por ciento de las ciudadanas y ciudadanos inscritos en el padrón electoral nacional. […]</li>
</ol>
<p><strong>Art. 137.</strong> El proyecto de ley será sometido a dos debates. […]<br />
Las ciudadanas y los ciudadanos que tengan interés en la aprobación del proyecto de ley, o que consideren que sus derechos puedan ser afectados por su expedición, podrán acudir ante la comisión y exponer sus argumentos.</p>
</blockquote>
<p><small>— <em>Constitución de la República del Ecuador</em> (2008), art. 134 et 137</small></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="12" data-paginate="true" data-class="text" data-theme="dgemc" lang="fr-FR" class="text" data-marpit-pagination="12" style="--paginate:true;--class:text;--theme:dgemc;" data-marpit-pagination-total="46" data-size="16:9">
<h3 id="le-parcours-dune-loi-en-%C3%A9quateur-small22small">Le parcours d'une loi en Équateur <small>(2/2)</small></h3>
<blockquote>
<p><strong>Art. 137 (suite).</strong> Aprobado el proyecto de ley, la Asamblea lo enviará a la Presidenta o Presidente de la República para que lo sancione u objete de forma fundamentada. Sancionado el proyecto de ley o de no haber objeciones dentro del plazo de treinta días posteriores a su recepción por parte de la Presidenta o Presidente de la República, se promulgará la ley, y se publicará en el Registro Oficial.</p>
<p><strong>Art. 138, al. 1.</strong> Si la Presidenta o Presidente de la República objeta totalmente el proyecto de ley, la Asamblea podrá volver a considerarlo solamente después de un año contado a partir de la fecha de la objeción. Transcurrido este plazo, la Asamblea podrá ratificarlo en un solo debate, con el voto favorable de las dos terceras partes de sus miembros, y lo enviará inmediatamente al Registro Oficial para su publicación.</p>
<p><strong>Art. 139, al. 1.</strong> Si la objeción de la Presidenta o Presidente de la República se fundamenta en la inconstitucionalidad total o parcial del proyecto, requerirá dictamen de la Corte Constitucional, que lo emitirá dentro del plazo de treinta días.</p>
</blockquote>
<p><small>— <em>Constitución de la República del Ecuador</em> (2008), art. 137, 138 et 139</small></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="13" data-paginate="true" data-theme="dgemc" lang="fr-FR" data-marpit-pagination="13" style="--paginate:true;--theme:dgemc;" data-marpit-pagination-total="46" data-size="16:9">
<h3 id="vocabulaire-1">Vocabulaire</h3>
<ul>
<li><strong>Asambleísta</strong> : membre de l'Assemblée nationale, la <strong>seule</strong> chambre du Parlement équatorien.</li>
<li><strong>Bancada</strong> : groupe parlementaire.</li>
<li><strong>Padrón electoral</strong> : liste électorale.</li>
<li><strong>Debate</strong> : lecture du texte en séance.</li>
<li><strong>Sancionar</strong> : pour le Président, approuver la loi votée.</li>
<li><strong>Objetar</strong> : la refuser, en tout (<em>totalmente</em>) ou en partie.</li>
<li><strong>Registro Oficial</strong> : l'équivalent du <em>Journal officiel</em>.</li>
<li><strong>Dictamen</strong> : avis rendu par la Corte Constitucional.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="14" data-paginate="true" data-theme="dgemc" lang="fr-FR" data-marpit-pagination="14" style="--paginate:true;--theme:dgemc;" data-marpit-pagination-total="46" data-size="16:9">

<ol>

<li>Quelle étape du parcours français n'existe pas en Équateur ? Pourquoi ?</li>
<li>Quel pouvoir le Président équatorien a-t-il sur la loi, que le Président français n'a pas ?</li>
<li><strong>Selon vous</strong>, dans quel pays le citoyen a-t-il le plus de place dans la fabrication de la loi ? Justifiez avec deux articles.</li>
</ol>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="15" data-paginate="true" data-theme="dgemc" lang="fr-FR" data-marpit-pagination="15" style="--paginate:true;--theme:dgemc;" data-marpit-pagination-total="46" data-size="16:9">

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="16" data-paginate="true" data-class="lead transition" data-theme="dgemc" lang="fr-FR" class="lead transition" data-marpit-pagination="16" style="--paginate:true;--class:lead transition;--theme:dgemc;" data-marpit-pagination-total="46" data-size="16:9">
<h2 id="2-activit%C3%A9--placer-les-r%C3%A8gles-puis-les-juges-dans-la-pyramide">2. Activité : placer les règles, puis les juges, dans la pyramide</h2>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="17" data-paginate="true" data-theme="dgemc" lang="fr-FR" data-marpit-pagination="17" style="--paginate:true;--theme:dgemc;" data-marpit-pagination-total="46" data-size="16:9">
<h3 id="%C3%A0-retenir--quest-ce-quune-constitution">À retenir — Qu'est-ce qu'une Constitution ?</h3>
<p>La Constitution est le texte qui fonde l'État. Elle contient deux choses.</p>
<ol>
<li><strong>L'organisation des pouvoirs</strong> : ce que peut faire chaque organe de l'État (le Président, le Gouvernement, le Parlement, les juges) — et donc aussi ce qu'il <strong>ne peut pas</strong> faire.</li>
<li><strong>Les droits fondamentaux</strong> des citoyens, et les moyens de les protéger. Comme la Constitution est difficile à modifier, un droit qui y est inscrit est difficile à supprimer.</li>
</ol>
<p><strong>D'où vient son autorité ? Du peuple.</strong> « La souveraineté nationale appartient au peuple qui l'exerce par ses représentants et par la voie du référendum » (art. 3) : c'est la <strong>démocratie représentative</strong> (on élit des représentants) complétée par la <strong>démocratie directe</strong> (le référendum).</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="18" data-paginate="true" data-theme="dgemc" lang="fr-FR" data-marpit-pagination="18" style="--paginate:true;--theme:dgemc;" data-marpit-pagination-total="46" data-size="16:9">
<h3 id="%C3%A0-retenir--pourquoi-s%C3%A9parer-les-pouvoirs">À retenir — Pourquoi séparer les pouvoirs ?</h3>
<p><strong>Montesquieu</strong> (<em>De l'esprit des lois</em>, 1748, livre XI, chap. 6) distingue trois pouvoirs : <strong>faire les lois</strong> (législatif), <strong>les exécuter</strong> (exécutif), <strong>juger</strong> (judiciaire).</p>
<p>S'ils sont réunis dans les mêmes mains, il n'y a plus de liberté : celui qui fait la loi pourrait l'appliquer et juger à sa guise.</p>
<p>La Constitution doit donc <strong>séparer les pouvoirs</strong>, pour protéger le citoyen des abus.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="19" data-paginate="true" data-theme="dgemc" lang="fr-FR" data-marpit-pagination="19" style="--paginate:true;--theme:dgemc;" data-marpit-pagination-total="46" data-size="16:9">
<h3 id="quelle-place-pour-la-constitution--hans-kelsen-et-la-pyramide-des-normes">Quelle place pour la constitution ? Hans Kelsen et la pyramide des normes</h3>
<p><strong>Hans Kelsen</strong> (1881-1973), juriste autrichien, est le théoricien de la hiérarchie des normes (<em>Théorie pure du droit</em>, 1934). Son idée : <strong>une règle n'est valable que parce qu'une règle supérieure permet de l'écrire.</strong> L'arrêté du maire vaut parce que la loi donne au maire le pouvoir d'en faire ; la loi vaut parce que la Constitution donne au Parlement le droit de voter les lois ; et ainsi de suite jusqu'à la Constitution, au sommet.</p>
<p>Kelsen parle d'une construction « par degrés » ; ses lecteurs en ont fait l'image de la <strong>pyramide</strong> : au sommet, peu de règles, les plus importantes ; à la base, les plus nombreuses et les plus précises.</p>
<p><strong>Kelsen en a tiré une conséquence pratique</strong> : si la Constitution est au-dessus de la loi, il faut un <strong>juge</strong> pour le faire respecter. Il a conçu la <strong>Cour constitutionnelle autrichienne</strong>, créée en <strong>1920</strong>, l'une des premières d'Europe. En France, c'est le rôle du <strong>Conseil constitutionnel</strong>, et en Équateur de la <em>corte constitucional</em>.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="20" data-paginate="true" data-theme="dgemc" lang="fr-FR" data-marpit-pagination="20" style="--paginate:true;--theme:dgemc;" data-marpit-pagination-total="46" data-size="16:9">

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="22" data-paginate="true" data-theme="dgemc" lang="fr-FR" data-marpit-pagination="22" style="--paginate:true;--theme:dgemc;" data-marpit-pagination-total="46" data-size="16:9">

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="23" data-paginate="true" data-theme="dgemc" lang="fr-FR" data-marpit-pagination="23" style="--paginate:true;--theme:dgemc;" data-marpit-pagination-total="46" data-size="16:9">
<h3 id="exercice-2">Exercice 2</h3>
<p>Pour chaque conflit, dites qui peut le trancher, ce qu'il fait de la règle inférieure et quel document (C à J) vous l'apprend, puis écrivez le nom du juge sur la pyramide, entre les deux blocs concernés.</p>
<p><em>Les juges à placer</em> (l'un d'eux ne se place nulle part, un autre sert plusieurs fois) : <strong>le Conseil constitutionnel</strong> · <strong>tous les juges</strong> (tribunaux, cours d'appel, Cour de cassation, Conseil d'État) · <strong>le juge administratif</strong> (tribunaux administratifs, Conseil d'État) · <strong>la Cour européenne des droits de l'homme</strong> · <strong>personne</strong>.</p>
<p><strong>Utilisez les documents A à J (extraits de la Constitution et de décisions de justice) et le vocabulaire.</strong></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="24" data-paginate="true" data-theme="dgemc" lang="fr-FR" data-marpit-pagination="24" style="--paginate:true;--theme:dgemc;" data-marpit-pagination-total="46" data-size="16:9">
<h3 id="exercice-2--les-conflits">Exercice 2 — Les conflits</h3>
<table>
<thead>
<tr>
<th>Le conflit</th>
<th>Qui peut le trancher ?</th>
<th>Que fait-il de la règle inférieure ?</th>
<th>Document</th>
</tr>
</thead>
<tbody>
<tr>
<td>Une <strong>loi</strong> votée, pas encore promulguée, viole la Constitution</td>
<td></td>
<td></td>
<td></td>
</tr>
<tr>
<td>Une <strong>loi</strong> déjà en vigueur viole les droits garantis par la Constitution</td>
<td></td>
<td></td>
<td></td>
</tr>
<tr>
<td>Un <strong>traité</strong> pas encore ratifié viole la Constitution</td>
<td></td>
<td></td>
<td></td>
</tr>
<tr>
<td>Une <strong>loi</strong> viole un traité</td>
<td></td>
<td></td>

</tr>
<tr>
<td>Un <strong>décret</strong> ou un <strong>arrêté</strong> viole la loi ou la Constitution</td>

<td>On veut changer la <strong>Constitution</strong> elle-même</td>
<td></td>

</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="25" data-paginate="true" data-class="text" data-theme="dgemc" lang="fr-FR" class="text" data-marpit-pagination="25" style="--paginate:true;--class:text;--theme:dgemc;" data-marpit-pagination-total="46" data-size="16:9">
<h3 id="documents-a-et-b">Documents A et B</h3>
<blockquote>
<p><strong>A — Constitution, Préambule.</strong> Le peuple français proclame solennellement son attachement aux Droits de l'homme et aux principes de la souveraineté nationale tels qu'ils ont été définis par la Déclaration de 1789, confirmée et complétée par le préambule de la Constitution de 1946, ainsi qu'aux droits et devoirs définis dans la Charte de l'environnement de 2004.</p>
<p><strong>B — Constitution, art. 55.</strong> Les traités ou accords régulièrement ratifiés ou approuvés ont, dès leur publication, une autorité supérieure à celle des lois, sous réserve, pour chaque accord ou traité, de son application par l'autre partie.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="26" data-paginate="true" data-class="text" data-theme="dgemc" lang="fr-FR" class="text" data-marpit-pagination="26" style="--paginate:true;--class:text;--theme:dgemc;" data-marpit-pagination-total="46" data-size="16:9">
<h3 id="documents-c-et-d">Documents C et D</h3>
<blockquote>
<p><strong>C — Constitution, art. 54.</strong> Si le Conseil constitutionnel, saisi par le Président de la République, par le Premier ministre, par le président de l'une ou l'autre assemblée ou par soixante députés ou soixante sénateurs, a déclaré qu'un engagement international comporte une clause contraire à la Constitution, l'autorisation de ratifier ou d'approuver l'engagement international en cause ne peut intervenir qu'après révision de la Constitution.</p>
<p><strong>D — Constitution, art. 61, al. 2.</strong> Aux mêmes fins <em>[vérifier qu'elles respectent la Constitution]</em>, les lois peuvent être déférées au Conseil constitutionnel, avant leur promulgation, par le Président de la République, le Premier ministre, le président de l'Assemblée nationale, le président du Sénat ou soixante députés ou soixante sénateurs.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="27" data-paginate="true" data-class="text" data-theme="dgemc" lang="fr-FR" class="text" data-marpit-pagination="27" style="--paginate:true;--class:text;--theme:dgemc;" data-marpit-pagination-total="46" data-size="16:9">
<h3 id="documents-e-et-f">Documents E et F</h3>
<blockquote>
<p><strong>E — Constitution, art. 61-1, al. 1.</strong> Lorsque, à l'occasion d'une instance en cours devant une juridiction, il est soutenu qu'une disposition législative porte atteinte aux droits et libertés que la Constitution garantit, le Conseil constitutionnel peut être saisi de cette question sur renvoi du Conseil d'État ou de la Cour de cassation qui se prononce dans un délai déterminé.</p>
<p><strong>F — Constitution, art. 62, al. 1 et 2.</strong> Une disposition déclarée inconstitutionnelle sur le fondement de l'article 61 ne peut être promulguée ni mise en application.<br />
Une disposition déclarée inconstitutionnelle sur le fondement de l'article 61-1 est abrogée à compter de la publication de la décision du Conseil constitutionnel ou d'une date ultérieure fixée par cette décision. […]</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="28" data-paginate="true" data-class="text" data-theme="dgemc" lang="fr-FR" class="text" data-marpit-pagination="28" style="--paginate:true;--class:text;--theme:dgemc;" data-marpit-pagination-total="46" data-size="16:9">
<h3 id="documents-g-et-h">Documents G et H</h3>
<blockquote>
<p><strong>G — Constitution, art. 62, al. 3.</strong> Les décisions du Conseil constitutionnel ne sont susceptibles d'aucun recours. Elles s'imposent aux pouvoirs publics et à toutes les autorités administratives et juridictionnelles.</p>
<p><strong>H — Constitution, art. 89, al. 1 et 5.</strong> L'initiative de la révision de la Constitution appartient concurremment au Président de la République sur proposition du Premier ministre et aux membres du Parlement. […]<br />
La forme républicaine du Gouvernement ne peut faire l'objet d'une révision.</p>
</blockquote>
<p><small>Les documents A à H viennent de la Constitution.</small></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="29" data-paginate="true" data-class="text" data-theme="dgemc" lang="fr-FR" class="text" data-marpit-pagination="29" style="--paginate:true;--class:text;--theme:dgemc;" data-marpit-pagination-total="46" data-size="16:9">
<h3 id="documents-i-et-j">Documents I et J</h3>
<blockquote>
<p><strong>I — Conseil constitutionnel, décision n° 86-224 DC du 23 janvier 1987, considérant 15.</strong> […] relève en dernier ressort de la compétence de la juridiction administrative l'annulation ou la réformation des décisions prises, dans l'exercice des prérogatives de puissance publique, par les autorités exerçant le pouvoir exécutif, leurs agents, les collectivités territoriales de la République ou les organismes publics placés sous leur autorité ou leur contrôle.</p>
<p><strong>J — Une loi contraire à un traité.</strong> L'article 55 dit que le traité l'emporte sur la loi, mais il ne dit pas <strong>qui</strong> le fait respecter. En 1975, le Conseil constitutionnel refuse : son rôle est de comparer la loi à la Constitution, pas aux traités. La même année, la Cour de cassation accepte (arrêt <em>Jacques Vabre</em>), puis le Conseil d'État en 1989 (arrêt <em>Nicolo</em>). Depuis, <strong>tout juge</strong> peut refuser d'appliquer, dans le procès qu'il juge, une loi contraire à un traité. La loi n'est pas annulée : elle reste en vigueur, mais elle est <strong>écartée</strong>.</p>
</blockquote>
<p><small><strong>I et J ne viennent pas de la Constitution</strong> : ce sont des décisions de juges.</small></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="30" data-paginate="true" data-theme="dgemc" lang="fr-FR" data-marpit-pagination="30" style="--paginate:true;--theme:dgemc;" data-marpit-pagination-total="46" data-size="16:9">
<h3 id="vocabulaire-2">Vocabulaire</h3>
<ul>
<li><strong>Traité</strong> : accord conclu entre des États.</li>
<li><strong>Ratifier</strong> : pour un État, accepter définitivement d'être lié par un traité.</li>
<li><strong>Déférer</strong> : envoyer devant un juge.</li>
<li><strong>Disposition législative</strong> : un article de loi.</li>
<li><strong>Instance</strong> : un procès.</li>
<li><strong>Réviser la Constitution</strong> : la modifier.</li>
<li><strong>Juridiction administrative</strong> : les juges de l'administration (tribunaux administratifs, Conseil d'État).</li>
<li><strong>Réformation</strong> : modification d'une décision par le juge.</li>
<li><strong>Prérogatives de puissance publique</strong> : pouvoirs que seule l'administration possède (interdire, imposer).</li>
<li><strong>Collectivités territoriales</strong> : communes, départements, régions.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="31" data-paginate="true" data-theme="dgemc" lang="fr-FR" data-marpit-pagination="31" style="--paginate:true;--theme:dgemc;" data-marpit-pagination-total="46" data-size="16:9">
<h3 id="vocabulaire--les-actions">Vocabulaire — Les actions</h3>
<table>
<thead>
<tr>
<th>Action</th>
<th>Ce qu'elle fait</th>
<th>Qui la fait</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Annuler</strong></td>
<td>fait disparaître une règle comme si elle n'avait jamais existé</td>
<td>le <strong>juge administratif</strong>, pour un décret ou un arrêté</td>
</tr>
<tr>
<td><strong>Abroger</strong></td>
<td>fait disparaître une règle pour l'avenir</td>
<td>le <strong>Conseil constitutionnel</strong> (QPC) ; le Parlement, pour ses propres lois</td>
</tr>
<tr>
<td><strong>Écarter</strong></td>
<td>la règle reste en vigueur, mais le juge refuse de l'appliquer dans ce procès</td>
<td><strong>tout juge</strong>, pour une loi contraire à un traité</td>
</tr>
<tr>
<td><strong>Casser</strong></td>
<td>annule un <strong>jugement</strong> (pas une règle)</td>
<td>la <strong>Cour de cassation</strong></td>
</tr>
<tr>
<td><strong>Suspendre</strong></td>
<td>arrête une règle en urgence, en attendant de juger</td>
<td>le <strong>juge des référés</strong></td>
</tr>
</tbody>
</table>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="32" data-paginate="true" data-theme="dgemc" lang="fr-FR" data-marpit-pagination="32" style="--paginate:true;--theme:dgemc;" data-marpit-pagination-total="46" data-size="16:9">
<h3 id="%C3%A0-retenir--le-conseil-constitutionnel-smalltexte-%C3%A0-troussmall">À retenir — Le Conseil constitutionnel <small>(texte à trous)</small></h3>
<p><strong>Qui ?</strong> Neuf membres nommés pour neuf ans : trois par le Président de la République, trois par le président de l'Assemblée nationale, trois par le président du Sénat. Les anciens Présidents de la République en font partie de droit (art. 56).</p>
<p><strong>Que fait-il ?</strong> Il vérifie que les lois respectent la Constitution : c'est le <strong>contrôle de constitutionnalité</strong>. De deux manières :</p>
<ul>
<li><strong>avant</strong> la promulgation (contrôle <em>a priori</em>, depuis 1958) : le Président, le Premier ministre, les présidents des assemblées, 60 députés ou 60 sénateurs peuvent lui envoyer une loi votée. S'il la juge contraire à la Constitution, elle ne peut pas être <strong>(1) ________</strong> (art. 61 et 62) ;</li>
<li><strong>après</strong> (contrôle <em>a posteriori</em>, depuis 2010) : la <strong>question prioritaire de constitutionnalité</strong> (QPC). Au cours de n'importe quel procès, une personne peut soutenir que la loi qu'on lui applique viole ses droits constitutionnels. Si la <strong>(2) ________</strong> ou le <strong>(3) ________</strong> juge la question sérieuse, ils la transmettent au Conseil, qui peut <strong>(4) ________</strong> la loi (art. 61-1 et 62).</li>
</ul>
<p>Ses décisions sont <strong>sans recours</strong> et s'imposent à tous (art. 62).</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="33" data-paginate="true" data-theme="dgemc" lang="fr-FR" data-marpit-pagination="33" style="--paginate:true;--theme:dgemc;" data-marpit-pagination-total="46" data-size="16:9">
<h3 id="%C3%A0-retenir--la-jurisprudence--les-juges-aussi-font-et-transforment-le-droit-smalltexte-%C3%A0-troussmall">À retenir — La jurisprudence : les juges aussi font et transforment le droit <small>(texte à trous)</small></h3>
<p>La <strong>jurisprudence</strong> est l'ensemble des décisions rendues par les juges. Pour juger, le juge <strong>interprète</strong> la loi et l'applique à un cas concret. Quand une juridiction suprême (Cour de cassation, Conseil d'État, Conseil constitutionnel) tranche une question nouvelle, sa décision guide ensuite tous les autres juges : elle devient une <strong>règle</strong>.</p>
<p>Les documents I et J le montrent : <strong>aucun article de la Constitution</strong> ne dit que le <strong>(5) ________</strong> <strong>(6) ________</strong> les règlements, ni que <strong>(7) ________</strong> <strong>(8) ________</strong> une loi contraire à un traité. <strong>Ce sont des décisions de juges</strong> qui l'ont établi. La jurisprudence n'est pas un étage de la pyramide : c'est ce qui <strong>fait fonctionner</strong> la pyramide.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="34" data-paginate="true" data-class="lead transition" data-theme="dgemc" lang="fr-FR" class="lead transition" data-marpit-pagination="34" style="--paginate:true;--class:lead transition;--theme:dgemc;" data-marpit-pagination-total="46" data-size="16:9">
<h2 id="3-activit%C3%A9--laffaire-du-harc%C3%A8lement-sexuel">3. Activité : l'affaire du harcèlement sexuel</h2>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="35" data-paginate="true" data-theme="dgemc" lang="fr-FR" data-marpit-pagination="35" style="--paginate:true;--theme:dgemc;" data-marpit-pagination-total="46" data-size="16:9">
<h2 id="laffaire-g%C3%A9rard-ducray">L'affaire Gérard Ducray</h2>
<p>Gérard Ducray est poursuivi par trois femmes qui travaillaient sous ses ordres, pour <strong>harcèlement sexuel</strong>, un délit que définit l'<strong>article 222-33 du code pénal</strong> dans sa rédaction de 2002 :</p>
<blockquote>
<p>Le fait de harceler autrui dans le but d'obtenir des faveurs de nature sexuelle est puni d'un an d'emprisonnement et de 15 000 euros d'amende.</p>
</blockquote>
<p>Condamné, il ne conteste pas seulement sa condamnation : <strong>il attaque la loi elle-même.</strong></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="36" data-paginate="true" data-theme="dgemc" lang="fr-FR" data-marpit-pagination="36" style="--paginate:true;--theme:dgemc;" data-marpit-pagination-total="46" data-size="16:9">
<h3 id="exercice-small%C3%A9tapes-1-%C3%A0-5small">Exercice <small>(étapes 1 à 5)</small></h3>
<p>Pour chaque étape, dites qui agit, quelle règle est en jeu et à quel étage de la pyramide, et ce qu'il fait de cette règle : l'appliquer, l'annuler, l'abroger, l'écarter, casser un jugement.</p>
<table>
<thead>
<tr>
<th>N°</th>
<th>Étape</th>
</tr>
</thead>
<tbody>
<tr>
<td>1</td>
<td>Le tribunal correctionnel de Villefranche-sur-Saône condamne Gérard Ducray pour harcèlement sexuel.</td>
</tr>
<tr>
<td>2</td>
<td>Il fait appel. La cour d'appel de Lyon le condamne à son tour.</td>
</tr>
<tr>
<td>3</td>
<td>Il se pourvoit en cassation et pose une <strong>QPC</strong> : l'article 222-33 est trop vague ; il viole l'article 8 de la Déclaration de 1789 : « […] nul ne peut être puni qu'en vertu d'une loi établie et promulguée antérieurement au délit, et légalement appliquée. »</td>
</tr>
<tr>
<td>4</td>
<td><strong>29 février 2012.</strong> La Cour de cassation juge la question sérieuse et la <strong>transmet</strong> au Conseil constitutionnel.</td>
</tr>
<tr>
<td>5</td>
<td><strong>4 mai 2012.</strong> Le Conseil constitutionnel déclare l'article 222-33 contraire à la Constitution, avec effet immédiat : le harcèlement sexuel n'est plus un délit.</td>
</tr>
</tbody>
</table>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="37" data-paginate="true" data-theme="dgemc" lang="fr-FR" data-marpit-pagination="37" style="--paginate:true;--theme:dgemc;" data-marpit-pagination-total="46" data-size="16:9">
<h3 id="exercice-small%C3%A9tapes-6-%C3%A0-9small">Exercice <small>(étapes 6 à 9)</small></h3>
<table>
<thead>
<tr>
<th>N°</th>
<th>Étape</th>
</tr>
</thead>
<tbody>
<tr>
<td>6</td>
<td><strong>6 août 2012.</strong> Le Parlement vote une nouvelle loi qui définit précisément le harcèlement sexuel. Elle ne vaut que pour l'avenir.</td>
</tr>
<tr>
<td>7</td>
<td><strong>26 juin 2013.</strong> La Cour de cassation annule la condamnation de Gérard Ducray pour harcèlement sexuel et renvoie l'affaire devant une cour d'appel.</td>
</tr>
<tr>
<td>8</td>
<td><strong>17 novembre 2014.</strong> La cour d'appel de Lyon le condamne pour <strong>agressions sexuelles aggravées</strong> à l'encontre d'une des trois femmes : un mois de prison avec sursis et 3 000 euros d'amende.</td>
</tr>
<tr>
<td>9</td>
<td>Une des victimes et une association saisissent la <strong>Cour européenne des droits de l'homme</strong> contre la France.</td>
</tr>
</tbody>
</table>
<p><small>Pour chaque étape : qui agit ? · règle en jeu (étage de la pyramide) · que fait-il ?</small></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="38" data-paginate="true" data-theme="dgemc" lang="fr-FR" data-marpit-pagination="38" style="--paginate:true;--theme:dgemc;" data-marpit-pagination-total="46" data-size="16:9">
<h2 id="questions-2">Questions</h2>
<ol>
<li>À quelle étape l'affaire « monte-t-elle » dans la pyramide ? Pourquoi le tribunal de Villefranche ne pouvait-il pas, lui, juger la loi ?</li>
<li>Pourquoi la nouvelle loi de 2012 ne peut-elle pas s'appliquer à Gérard Ducray ? <em>(Pensez à l'article 8 de la Déclaration de 1789.)</em></li>
<li>À l'étape 8, les juges n'utilisent plus l'article 222-33. Quelle autre règle ont-ils appliquée ?</li>
<li>Étape 9 : devant quel étage de la pyramide la France est-elle appelée à répondre ? Ce juge peut-il annuler une loi française ?</li>
<li><strong>Selon vous</strong>, le Conseil constitutionnel aurait-il dû retarder l'abrogation de quelques mois, comme l'article 62 le lui permettait ? Qui a gagné, qui a perdu à l'effet immédiat ?</li>
</ol>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="39" data-paginate="true" data-class="lead transition" data-theme="dgemc" lang="fr-FR" class="lead transition" data-marpit-pagination="39" style="--paginate:true;--class:lead transition;--theme:dgemc;" data-marpit-pagination-total="46" data-size="16:9">
<h2 id="4-la-pyramide-%C3%A9quatorienne">4. La pyramide équatorienne</h2>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="40" data-paginate="true" data-class="text" data-theme="dgemc" lang="fr-FR" class="text" data-marpit-pagination="40" style="--paginate:true;--class:text;--theme:dgemc;" data-marpit-pagination-total="46" data-size="16:9">
<h3 id="la-pyramide-%C3%A9quatorienne-small13small">La pyramide équatorienne <small>(1/3)</small></h3>
<blockquote>
<p><strong>Art. 424.</strong> La Constitución es la norma suprema y prevalece sobre cualquier otra del ordenamiento jurídico. […] La Constitución y los tratados internacionales de derechos humanos ratificados por el Estado que reconozcan derechos más favorables a los contenidos en la Constitución, prevalecerán sobre cualquier otra norma jurídica o acto del poder público.</p>
<p><strong>Art. 425.</strong> El orden jerárquico de aplicación de las normas será el siguiente : La Constitución ; los tratados y convenios internacionales ; las leyes orgánicas ; las leyes ordinarias ; las normas regionales y las ordenanzas distritales ; los decretos y reglamentos ; las ordenanzas ; los acuerdos y las resoluciones ; y los demás actos y decisiones de los poderes públicos. En caso de conflicto entre normas de distinta jerarquía, la Corte Constitucional, las juezas y jueces, autoridades administrativas y servidoras y servidores públicos, lo resolverán mediante la aplicación de la norma jerárquica superior. […]</p>
</blockquote>
<p><small>— <em>Constitución de la República del Ecuador</em> (2008), art. 424 et 425</small></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="41" data-paginate="true" data-class="text" data-theme="dgemc" lang="fr-FR" class="text" data-marpit-pagination="41" style="--paginate:true;--class:text;--theme:dgemc;" data-marpit-pagination-total="46" data-size="16:9">
<h3 id="la-pyramide-%C3%A9quatorienne-small23small">La pyramide équatorienne <small>(2/3)</small></h3>
<blockquote>
<p><strong>Art. 428.</strong> Cuando una jueza o juez, de oficio o a petición de parte, considere que una norma jurídica es contraria a la Constitución […], suspenderá la tramitación de la causa y remitirá en consulta el expediente a la Corte Constitucional, que en un plazo no mayor a cuarenta y cinco días, resolverá sobre la constitucionalidad de la norma. […]</p>
<p><strong>Art. 436, 2.</strong> [La Corte Constitucional ejercerá las siguientes atribuciones :] Conocer y resolver las acciones públicas de inconstitucionalidad, por el fondo o por la forma, contra actos normativos de carácter general emitidos por órganos y autoridades del Estado. La declaratoria de inconstitucionalidad tendrá como efecto la invalidez del acto normativo impugnado.</p>
</blockquote>
<p><small>— <em>Constitución de la República del Ecuador</em> (2008), art. 428 et 436</small></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="42" data-paginate="true" data-class="text" data-theme="dgemc" lang="fr-FR" class="text" data-marpit-pagination="42" style="--paginate:true;--class:text;--theme:dgemc;" data-marpit-pagination-total="46" data-size="16:9">
<h3 id="la-pyramide-%C3%A9quatorienne-small33small">La pyramide équatorienne <small>(3/3)</small></h3>
<blockquote>
<p><strong>Art. 439.</strong> Las acciones constitucionales podrán ser presentadas por cualquier ciudadana o ciudadano individual o colectivamente.</p>
<p><strong>Art. 173.</strong> Los actos administrativos de cualquier autoridad del Estado podrán ser impugnados, tanto en la vía administrativa como ante los correspondientes órganos de la Función Judicial.</p>
</blockquote>
<p><small>— <em>Constitución de la República del Ecuador</em> (2008), art. 439 et 173</small></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="43" data-paginate="true" data-theme="dgemc" lang="fr-FR" data-marpit-pagination="43" style="--paginate:true;--theme:dgemc;" data-marpit-pagination-total="46" data-size="16:9">
<h3 id="vocabulaire-3">Vocabulaire</h3>
<ul>
<li><strong>Ley orgánica</strong> : loi qui organise les institutions ou les droits fondamentaux ; elle exige la majorité absolue de l'Assemblée.</li>
<li><strong>Ordenanza</strong> : règle d'une collectivité locale (district, canton).</li>
<li><strong>Servidores públicos</strong> : les agents publics, les fonctionnaires.</li>
<li><strong>Invalidez</strong> : la règle cesse d'exister.</li>
<li><strong>Impugnar</strong> : contester devant un juge.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="44" data-paginate="true" data-theme="dgemc" lang="fr-FR" data-marpit-pagination="44" style="--paginate:true;--theme:dgemc;" data-marpit-pagination-total="46" data-size="16:9">
<h2 id="questions-3">Questions</h2>
<ol>
<li>Dessinez la pyramide équatorienne à partir de l'article 425. Combien a-t-elle d'étages ?</li>
<li>Pour les étages « Constitution », « lois » et « actes administratifs », répondez à la question de la séance : <strong>qui peut annuler ?</strong> (art. 436, 439, 428, 173).</li>
<li>En France, qui peut demander au Conseil constitutionnel de juger une loi déjà en vigueur ? Et en Équateur ?</li>
<li>Relisez la fin de l'article 424 : quels traités peuvent passer <strong>au-dessus</strong> de la Constitution ? Est-ce possible en France (document C) ?</li>
<li>D'après l'article 425, qui doit appliquer la règle supérieure en cas de conflit ? Et en France ?</li>
<li><strong>Selon vous</strong>, quel système protège le mieux le citoyen ? Lequel donne le plus de <strong>sécurité juridique</strong> ?</li>
</ol>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="45" data-paginate="true" data-class="lead transition" data-theme="dgemc" lang="fr-FR" class="lead transition" data-marpit-pagination="45" style="--paginate:true;--class:lead transition;--theme:dgemc;" data-marpit-pagination-total="46" data-size="16:9">
<h2 id="compl%C3%A9ment--laffaire-paola-rold%C3%A1n">Complément : l'affaire Paola Roldán</h2>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="46" data-paginate="true" data-theme="dgemc" lang="fr-FR" data-marpit-pagination="46" style="--paginate:true;--theme:dgemc;" data-marpit-pagination-total="46" data-size="16:9">
<h3 id="laffaire-paola-rold%C3%A1n">L'affaire Paola Roldán</h3>
<p>Le 8 août 2023, Paola Roldán, atteinte de sclérose latérale amyotrophique, attaque directement devant la Corte constitucional l'article 144 du code pénal, qui punit l'homicide, et donc toute aide à mourir. Aucun procès n'était en cours : l'article 439 lui permet d'attaquer la loi directement. Le 5 février 2024 (sentencia 67-23-IN/24), la Corte juge que l'article 144 ne s'applique pas au médecin qui pratique une euthanasie à la demande libre d'une personne gravement et incurablement malade, et ordonne à l'Assemblée de voter une loi.</p>
<p><small>— Corte Constitucional del Ecuador, sentencia 67-23-IN/24, 5 février 2024</small></p>
<h2 id="question">Question</h2>
<p>Comparez avec le parcours de Gérard Ducray : combien d'étapes, combien de juges ?</p>
</section>
